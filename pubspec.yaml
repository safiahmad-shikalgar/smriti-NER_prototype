name: smriti_mvp_new
description: "SMRITI-NER: Elderly-Friendly Cognitive & Memory Support Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1
  flutter_tts: ^4.2.2
  camera: ^0.11.1
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.13.0
  supabase_flutter: ^2.8.4
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/market/
    - assets/images/family/
    - assets/images/memories/
    - assets/images/culture/
    - assets/models/
